name: Deploy Blogger Service

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  enable-maintenance:
    name: Enable maintenance mode
    runs-on: ubuntu-latest
    steps:
      - name: Enable maintenance through Blogger FastAPI
        env:
          MAINTENANCE_ON_URL: ${{ secrets.BLOGGER_MAINTENANCE_ON_URL }}
          MAINTENANCE_TOKEN: ${{ secrets.MAINTENANCE_TOKEN }}
        run: |
          set -e
          test -n "$MAINTENANCE_ON_URL" || { echo "Missing BLOGGER_MAINTENANCE_ON_URL secret"; exit 1; }
          curl --fail --silent --show-error --request POST \
            --header "Authorization: Bearer $MAINTENANCE_TOKEN" \
            "$MAINTENANCE_ON_URL"

  deploy:
    name: Deploy Blogger to EC2
    runs-on: ubuntu-latest
    needs: enable-maintenance
    steps:
      - name: SSH and Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USERNAME }}
          key: ${{ secrets.AWS_PRIVATE_KEY }}
          script: |
            set -e
            cd "${{ secrets.APP_PATH }}"
            git fetch origin main
            git checkout -f -B main origin/main
            ./venv/bin/pip install -r requirements.txt
            pm2 restart blogger-service
            echo "Deployment commands completed successfully."

  selenium-smoke-tests:
    name: Selenium Smoke Tests
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable
          install-chromedriver: true

      - name: Install Selenium test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install selenium pytest

      - name: Wait for deployed Blogger page
        env:
          BLOGGER_BASE_URL: https://www.chakorahub.com
        run: |
          for attempt in {1..12}; do
            if curl --fail --silent --show-error --location --max-time 10 "$BLOGGER_BASE_URL/blogger" > /dev/null; then
              echo "Deployed website is responding."
              exit 0
            fi
            echo "Website not ready (attempt $attempt/12)."
            sleep 10
          done
          echo "Deployed website did not become ready."
          exit 1

      - name: Run Selenium smoke tests
        env:
          BLOGGER_BASE_URL: https://www.chakorahub.com
          EXPECT_MAINTENANCE_NOTICE: "true"
          RUN_WRITE_TESTS: "false"
        run: |
          pytest -v blogger_smoke.py --junitxml=selenium-results.xml

      - name: Upload Selenium results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selenium-results
          path: selenium-results.xml
          if-no-files-found: warn

  disable-maintenance:
    name: Disable maintenance after passing tests
    runs-on: ubuntu-latest
    needs: selenium-smoke-tests
    if: ${{ needs.selenium-smoke-tests.result == 'success' }}
    steps:
      - name: Disable maintenance through Blogger FastAPI
        env:
          MAINTENANCE_OFF_URL: ${{ secrets.BLOGGER_MAINTENANCE_OFF_URL }}
          MAINTENANCE_TOKEN: ${{ secrets.MAINTENANCE_TOKEN }}
        run: |
          set -e
          test -n "$MAINTENANCE_OFF_URL" || { echo "Missing BLOGGER_MAINTENANCE_OFF_URL secret"; exit 1; }
          curl --fail --silent --show-error --request POST \
            --header "Authorization: Bearer $MAINTENANCE_TOKEN" \
            "$MAINTENANCE_OFF_URL"
