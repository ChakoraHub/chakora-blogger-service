name: Build and Push Blogger Service to GHCR

on:
  push:
    branches:
      - main
      - 'feature/**'
    paths:
      - 'Dockerfile'
      - 'blogger_service.py'
      - 'requirements.txt'
      - '.github/workflows/docker-publish.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/chakorahub/chakora-blogger-service:v1
            ghcr.io/chakorahub/chakora-blogger-service:latest
